plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.whaleglow.immersive'
    compileSdk 34

    defaultConfig {
        applicationId "com.whaleglow.immersive"
        minSdk 33
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            // Xposed 模块类名必须保持，不做混淆
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    packaging {
        resources {
            excludes += ['META-INF/**', 'kotlin/**', 'DebugProbesKt.bin']
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    // Xposed API 本地 jar（compileOnly：不打进 dex，运行时由 LSPosed 提供）
    compileOnly files('libs/api-82.jar')
    implementation 'androidx.core:core-ktx:1.12.0'
}